name: Pipeline

# Runs once a day: reads USGS and BMKG, updates the warehouse, publishes the data and the page.
# Scheduled runs are best effort on GitHub's side and can start late.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: auto picks backfill on the first run and incremental after that
        type: choice
        options: [auto, incremental, backfill]
        default: auto

# Runs must never overlap: each one reads the previous warehouse and replaces it.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the data branch
    outputs:
      publishable: ${{ steps.result.outputs.publishable }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Load previous warehouse
        run: |
          mkdir -p data out
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" data >/dev/null 2>&1; then
            git fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" data:refs/remotes/origin/data
            git show origin/data:warehouse.db > data/warehouse.db
            echo "Loaded the warehouse from the data branch"
          else
            echo "No data branch yet, starting a fresh warehouse"
          fi

      # A failed run still records itself and still exports, so the page can say what happened.
      # The job is failed at the end instead, once the data and the page have been published.
      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode || 'auto' }}
        run: dataharian run --db data/warehouse.db --out out/data.json --mode "$MODE"

      - name: Check what was produced
        id: result
        run: |
          if [ -s out/data.json ] && [ -s data/warehouse.db ]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "::error::The pipeline produced no data file"
          fi

      - name: Publish data branch
        if: ${{ steps.result.outputs.publishable == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish="$(mktemp -d)"
          cp data/warehouse.db out/data.json "$publish"/
          cat > "$publish/README.md" <<'NOTE'
          Generated by the Pipeline workflow of the main branch. Do not edit.
          This branch always holds exactly one commit: the latest warehouse and public data.
          NOTE
          cd "$publish"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md warehouse.db data.json
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - uses: ./.github/actions/build-dashboard
        if: ${{ steps.result.outputs.publishable == 'true' }}
        with:
          data-file: out/data.json

      - name: Fail the job if the run failed
        if: ${{ steps.pipeline.outcome == 'failure' }}
        run: |
          echo "::error::The pipeline run failed. The last good data stays published; see the run summary."
          exit 1

  deploy:
    name: Deploy page
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.outputs.publishable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
